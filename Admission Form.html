<html>
	<head>
		<title> Admission Form </title>
	</head>
	<body>
	<table align="center" width="100%" cellspacing="7" height="400">
		<form name="admform">

		<tr colspan="2" >
			<th><b> Admission Form </b></th>
		</tr>
		<tr>
			<td><label for="name"> Enter Name: </label></td>
			<td><input type="text" name="name" id="name"  placeholder="enter your name" maxlength="10" required autofocus></td>
		</tr>
		<tr>
			<td><label for="mob"> Enter Mobile Number: </label></td>
			<td><input type="text" name="mob" placeholder="enter your mobile number" maxlength="10" ></td>
		</tr>
		<tr>
			<td><label for="email"> Enter email: </label></td>
			<td><input type="email" name="email" placeholder="enter your email address" ></td>
		</tr>
		<tr>
			<td><label for="pass"> Enter Password: </label></td>
			<td><input type="password" name="pass" placeholder="enter your password" ></td>
		</tr>
		<tr>
			<td><label for="age"> Enter Age: </label></td>
			<td><input type="number" name="age" placeholder="age" min="15" max="45" step="5" ></td>
		</tr>
		<tr>
			<td><label for="addrs"> Enter Address: </label></td>
			<td><textarea name="addrs" placeholder="select your city" rows="5" cols="40"> Gandhinagar</textarea></td>
		</tr>
		<tr>
			<td><label for="city" > Select city: </label></td>
			<td>	
				<select name="city">
					<option value=""> ---select city--- </option>
					<option value="gnr"> Gandhinagar </option>
					<option value="amd"> Ahmdabad </option>
					<option value="brd"> Baroda </option>
					<option value="srt"> Surat </option>
				</select>
			</td>
			
		</tr>
		<tr>
			<td><label for="course" > Select Course: </label></td>
			<td>	
				<input type="checkbox" name="course" value="ccc"> CCC
				<input type="checkbox" name="course" value="tally"> Tally Prime									
				<input type="checkbox" name="course" value="java"> JAVA
				<input type="checkbox" name="course" value="python"> Python
				<input type="checkbox" name="course" value="wd"> Web Design
			</td>
		</tr>
		<tr>
			<td><label for="gender"> Select Gender: </label></td>
			<td>
				<input type="radio" name="gender" value="male" > Male
				<input type="radio" name="gender" value="female" > Female
				<input type="radio" name="gender" value="other" > Other
			</td>
		</tr>
			
		<tr>
			<td><label for="fruit"> Select your Fruit: </label></td>
			<td><input type="text" name="fruit" list="fruits" ></td>
		</tr>
		<tr>
			<td><label for="color"> Select Color: </label</td>
			<td><input type="color" name="color"</td>
		</tr>
		<tr>
			<td><label for="date"> Select Bdate: </label</td>
			<td><input type="date" name="date"</td>
		</tr>
		<tr>
			<td><label for="week"> Select week: </label</td>
			<td><input type="week" name="week"</td>
		</tr>
		<tr>
			<td><label for="month"> Select Month: </label</td>
			<td><input type="month" name="month"</td>
		</tr>
		<tr>
			<td><label for="photo"> Upload Photo: </label</td>
			<td><input type="file" name="photo"</td>
		</tr>
		<tr colspan="2">
			<td><input type="submit" value="Register" > <input type="reset" value="cancle" ></td>
		</tr>
		</form>
		<tr colspan="2">
			<td><button> Delete Record </button></td>
		</tr>
	</table>
	</body>
</html>
